<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Instagram Followers - Instant 1000+ Free Followers</title>
    <meta name="description" content="Get 1000+ FREE Instagram followers instantly! No login required. Works for all accounts.">
    
    <!-- Critical CSS Inline for Speed -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #333;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            text-shadow: 0 4px 8px rgba(0,0,0,0.1);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px #ff6b6b); }
            to { filter: drop-shadow(0 0 20px #4ecdc4); }
        }
        
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }
        
        .username-input {
            width: 100%;
            padding: 18px 20px;
            font-size: 18px;
            border: 2px solid #e1e5e9;
            border-radius: 15px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .username-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: white;
        }
        
        .generate-btn {
            width: 100%;
            padding: 20px;
            margin-top: 25px;
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .generate-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
        }
        
        .generate-btn:active {
            transform: scale(0.98);
        }
        
        .results {
            margin-top: 30px;
            text-align: center;
            display: none;
        }
        
        .followers-count {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            animation: countUp 1s ease-out;
        }
        
        @keyframes countUp {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .status {
            font-size: 16px;
            color: #28a745;
            font-weight: 600;
            margin-top: 10px;
        }
        
        .features {
            margin-top: 30px;
            text-align: center;
        }
        
        .feature {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            font-size: 14px;
            color: #666;
        }
        
        .feature::before {
            content: "✅";
            margin-right: 10px;
            font-size: 18px;
        }
        
        .spinner {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .container { padding: 15px; }
            .logo h1 { font-size: 2rem; }
            .card { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>🚀 FreeFollowers</h1>
            <p style="color: rgba(255,255,255,0.9); margin-top: 5px;">Instant Instagram Growth</p>
        </div>
        
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 25px; color: #333; font-size: 24px;">
                Enter Instagram Username
            </h2>
            
            <input 
                type="text" 
                class="username-input" 
                placeholder="yourusername"
                id="username"
                maxlength="30"
                autocomplete="off"
            >
            
            <button class="generate-btn" onclick="generateFollowers()">
                🎁 Get 1000+ FREE Followers
            </button>
            
            <div class="spinner" id="spinner"></div>
            
            <div class="results" id="results">
                <div class="followers-count" id="count">1,247</div>
                <div class="status" id="status">
                    ✅ Followers delivered successfully!
                </div>
                <div style="font-size: 14px; color: #666; margin-top: 15px;">
                    Followers will appear in 5-10 minutes
                </div>
            </div>
        </div>
        
        <div class="features">
            <div class="feature">⚡ Instant Delivery (2-5 mins)</div>
            <div class="feature">🎯 Real & Active Users</div>
            <div class="feature">🔒 100% Safe & Secure</div>
            <div class="feature">💎 No Password Required</div>
        </div>
    </div>

    <script>
        // Super Fast Loading - No External Dependencies
        function generateFollowers() {
            const username = document.getElementById('username').value.trim();
            const spinner = document.getElementById('spinner');
            const results = document.getElementById('results');
            const btn = document.querySelector('.generate-btn');
            
            if (!username) {
                alert('⚠️ Please enter your Instagram username!');
                return;
            }
            
            // Show loading
            spinner.style.display = 'block';
            results.style.display = 'none';
            btn.disabled = true;
            btn.innerHTML = '⏳ Generating...';
            
            // Simulate fast processing (2-3 seconds)
            setTimeout(() => {
                spinner.style.display = 'none';
                btn.disabled = false;
                btn.innerHTML = '🔄 Generate More';
                results.style.display = 'block';
                
                // Random follower count between 1000-5000
                const followers = Math.floor(Math.random() * 4000) + 1000;
                document.getElementById('count').textContent = followers.toLocaleString();
                document.getElementById('status').textContent = `✅ ${followers.toLocaleString()} Followers sent to @${username}!`;
                
                // Auto-scroll to results
                results.scrollIntoView({ behavior: 'smooth' });
                
                // Track usage (fake analytics)
                console.log(`Generated ${followers} followers for @${username}`);
            }, Math.random() * 1000 + 1500); // 1.5-2.5 seconds
        }
        
        // Enter key support
        document.getElementById('username').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                generateFollowers();
            }
        });
        
        // Preload animation for instant feel
        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
